$schema: https://api.gitbook.com/gitbook-docs.yaml

site:
  title: Bughaw Literary Archive
  structure:
    - type: space
      key: about-bughaw-literary-archive
      title: About Bughaw Literary Archive
      path: archive-about
      default: true
      content:
        directory: ./olutanga/about-bughaw-literary-archive
    - type: space
      key: olutanga-collection
      title: Olutanga — Grassroots Fiction and Poetry
      path: olutanga
      content:
        directory: ./olutanga/olutanga-grassroots-fiction-and-poetry
    - type: space
      key: detective-fiction
      title: Detective Fiction
      path: detective
      content:
        directory: ./olutanga/detective-fiction
    - type: space
      key: worldbuilding
      title: Worldbuilding & Alternate History
      path: worldbuilding
      content:
        directory: ./olutanga/worldbuilding-and-alternate-history
    - type: space
      key: about
      title: About the Author
      path: about
      content:
        directory: ./olutanga/about-the-author
